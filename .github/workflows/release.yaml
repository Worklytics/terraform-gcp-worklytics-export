name: Create Release on Tag v{MAJOR}.{MINOR}.{PATCH}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Trigger the workflow on tag push events matching the semantic versioning pattern

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create Release
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} -t ${{ github.ref_name }} --generate-notes
