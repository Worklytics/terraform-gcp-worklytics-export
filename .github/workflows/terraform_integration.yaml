name: terraform_integration

on:
  pull_request:
  push:
    branches:
      - main
      - 'rc-*'

jobs:
  # Parallel matrix: init/validate/plan only. Do NOT apply/destroy here — every matrix
  # cell targets the same bucket IAM member, so concurrent apply/destroy races and
  # fail-fast cancels the rest of the matrix.
  tf_compat:
    name: 'Terraform plan (tf ${{ matrix.terraform_version }}, google ~> ${{ matrix.google_provider_major }}.0)'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Representative coverage across supported TF minors (full minor matrix is in validate/lint).
        # Keep this small so the plan×provider matrix doesn't starve the shared runner pool.
        terraform_version: [ '~1.6.0', '~1.9.0', '~1.12.0', '~1.15.0', 'latest' ]
        google_provider_major: [ '6', '7' ] # major versions to test against (module requires >= 6.0)
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      CI_SA_EMAIL: gh-actions-tf-gcp-export@worklytics-corp.iam.gserviceaccount.com
      GCP_IDENTITY_POOL: 'projects/432357880585/locations/global/workloadIdentityPools/github-actions/providers/github'
      EXAMPLE_TENANT_SA_EMAIL: w8s-export-tf-ci-tenant@worklytics-ci.iam.gserviceaccount.com
      BUCKET_NAME: terraform-gcp-worklytics-export-ci
    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: 'setup Terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - id: 'auth-gcp'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_IDENTITY_POOL }}
          service_account: ${{ env.CI_SA_EMAIL }}

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 483.0.0'

      - name: 'Pin Google provider to major ${{ matrix.google_provider_major }}'
        # Overwrite providers.tf (the sole required_providers location) to pin to this matrix
        # major version. Terraform resolves the intersection with the root module's ">= 6.0"
        # constraint. Writing into the existing file avoids a duplicate required_providers error.
        run: |
          cat > examples/basic/providers.tf <<EOF
          terraform {
            backend "local" {
              path = "terraform.tfstate"
            }

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> ${{ matrix.google_provider_major }}.0"
              }
            }
          }

          provider "google" {
          }
          EOF

      - name: 'Terraform init / validate / plan'
        working-directory: examples/basic
        run: |
          terraform init
          terraform validate
          terraform plan -input=false \
            -var="bucket_name=${{ env.BUCKET_NAME }}" \
            -var="worklytics_tenant_sa_email=${{ env.EXAMPLE_TENANT_SA_EMAIL }}"

  # Single end-to-end apply → GCS write → destroy against the shared CI bucket.
  tf_e2e:
    name: 'Terraform e2e (apply + gcs write + destroy)'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      WORKFLOW: 'integration'
      CI_SA_EMAIL: gh-actions-tf-gcp-export@worklytics-corp.iam.gserviceaccount.com
      GCP_IDENTITY_POOL: 'projects/432357880585/locations/global/workloadIdentityPools/github-actions/providers/github'
      EXAMPLE_TENANT_SA_EMAIL: w8s-export-tf-ci-tenant@worklytics-ci.iam.gserviceaccount.com
      BUCKET_NAME: terraform-gcp-worklytics-export-ci
    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: 'setup Terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
          terraform_wrapper: false

      - id: 'auth-gcp'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_IDENTITY_POOL }}
          service_account: ${{ env.CI_SA_EMAIL }}

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 483.0.0'

      - name: 'Terraform - integration test examples/basic apply'
        id: terraform_apply
        working-directory: examples/basic
        run: |
          CI_RUN="${{ env.WORKFLOW }}_${{ github.run_id }}_${{ github.run_attempt }}"
          echo "ci_run=${CI_RUN}" >> "$GITHUB_OUTPUT"
          terraform init
          terraform apply -auto-approve \
            -var="bucket_name=${{ env.BUCKET_NAME }}" \
            -var="worklytics_tenant_sa_email=${{ env.EXAMPLE_TENANT_SA_EMAIL }}"

      - name: 'Terraform - integration test examples/basic gcs write'
        run: |
          ./test/rsync.sh ${{ env.EXAMPLE_TENANT_SA_EMAIL }} ${{ env.BUCKET_NAME }} ${{ steps.terraform_apply.outputs.ci_run }}

      - name: 'Terraform - integration test examples/basic terraform destroy'
        if: always() # try to force this to ALWAYS happen, no matter if previous stuff failed
        working-directory: examples/basic
        run: |
          CI_RUN="${{ steps.terraform_apply.outputs.ci_run }}"
          if [ -n "${CI_RUN}" ]; then
            gsutil -m rm -r "gs://${{ env.BUCKET_NAME }}/${CI_RUN}/*" || true
          fi
          if [ -f terraform.tfstate ] || [ -f terraform.tfstate.backup ]; then
            terraform destroy -auto-approve \
              -var="bucket_name=${{ env.BUCKET_NAME }}" \
              -var="worklytics_tenant_sa_email=${{ env.EXAMPLE_TENANT_SA_EMAIL }}"
          fi

  # Branch protection requires a check named exactly "Terraform integration".
  integration_gate:
    name: Terraform integration
    needs: [tf_compat, tf_e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require plan matrix + e2e success
        run: |
          echo "tf_compat=${{ needs.tf_compat.result }}"
          echo "tf_e2e=${{ needs.tf_e2e.result }}"
          test "${{ needs.tf_compat.result }}" = "success"
          test "${{ needs.tf_e2e.result }}" = "success"
