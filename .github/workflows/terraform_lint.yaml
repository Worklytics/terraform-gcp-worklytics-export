name: terraform_lint

on:
  pull_request:
  push:
    branches:
      - main
      - 'rc-*'

jobs:
  tf_lint:
    name: 'Terraform lint (on tf ${{ matrix.terraform_version }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Representative TF minors for fmt; validate workflow covers the fuller set.
        terraform_version: [ '~1.3.0', '~1.6.0', '~1.9.0', '~1.12.0', '~1.15.0', 'latest' ]
    permissions:
      contents: 'read'
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: 'setup Terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform_version }}

      - name: 'lint Terraform code'
        # see https://www.terraform.io/cli/commands/fmt
        run:
          terraform fmt -check -recursive -diff .

  # Branch protection requires a check named exactly "Terraform lint".
  lint_gate:
    name: Terraform lint
    needs: [tf_lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require lint matrix success
        run: |
          echo "tf_lint=${{ needs.tf_lint.result }}"
          test "${{ needs.tf_lint.result }}" = "success"
